[package]
name = "opcov-cli"
version.workspace = true
edition.workspace = true
description = "Command-line tool to merge, convert and check opcov reports"
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "opcov"
path = "src/main.rs"

[dependencies]
clap.workspace = true
mimalloc = { version = "0.1.52", default-features = false, features = ["v2"] }
notify = "8.2.2"
opcov-core.workspace = true
opcov-php.workspace = true
opcov-syntax.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
proptest.workspace = true
roxmltree = "0.21.2"

[lints]
workspace = true
