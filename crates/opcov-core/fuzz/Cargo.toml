[package]
name = "opcov-core-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "=0.4.13"
opcov-core = { path = ".." }
serde_json = "=1.0.154"

[[bin]]
name = "cfg_classify"
path = "fuzz_targets/cfg_classify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "report_parse"
path = "fuzz_targets/report_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "report_merge"
path = "fuzz_targets/report_merge.rs"
test = false
doc = false
bench = false
