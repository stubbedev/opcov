[package]
name = "opcov-php"
version.workspace = true
edition.workspace = true
description = "Indexes a PHP project with mago and finds the code that uses changed members"
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
doctest = false
test = false

[dependencies]
aho-corasick = "1.1.5"
bincode = { version = "2.0.1", features = ["serde"] }
blake3 = "1.8.7"
foldhash = { version = "0.2.0", default-features = false }
mago-allocator = "=1.61.0"
mago-analyzer = "=1.61.0"
mago-codex = { version = "=1.61.0", features = ["serde"] }
mago-database = "=1.61.0"
mago-names = "=1.61.0"
mago-prelude = { version = "=1.61.0", features = ["serde"] }
mago-span = "=1.61.0"
mago-syntax = "=1.61.0"
mago-word = { version = "=1.61.0", features = ["serde"] }
rayon = "1.12.0"
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
mago-prelude = { version = "=1.61.0", features = ["build"] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
