name: "save-nix"
description: "On a push to the default branch whose store key has no cache yet, replace this platform's Nix store cache with the job's store, deleting the old one first so the repository never holds two stores of one platform"

runs:
  using: "composite"
  steps:
    - name: Decide whether this run replaces the store cache
      id: decide
      shell: bash
      env:
        DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
        EVENT: ${{ github.event_name }}
      run: |
        : "${NIX_STORE_CACHE_KEY:?save-nix runs after setup-nix in the same job}"
        : "${NIX_STORE_CACHE_HIT:?save-nix runs after setup-nix in the same job}"
        if [ "$EVENT" = push ] && [ "$GITHUB_REF" = "$DEFAULT_REF" ] && [ "$NIX_STORE_CACHE_HIT" = false ]; then
          echo "save=true" >> "$GITHUB_OUTPUT"
        else
          echo "save=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Delete this platform's older store caches
      if: steps.decide.outputs.save == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ids="$(gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$NIX_STORE_CACHE_PREFIX" --limit 100 --json id --jq '.[].id')"
        for id in $ids; do
          gh cache delete "$id" --repo "$GITHUB_REPOSITORY"
        done
    - uses: nix-community/cache-nix-action/save@7df957e333c1e5da7721f60227dbba6d06080569 # v7
      if: steps.decide.outputs.save == 'true'
      with:
        primary-key: ${{ env.NIX_STORE_CACHE_KEY }}
        gc-max-store-size-linux: 8G
        gc-max-store-size-macos: 6G
