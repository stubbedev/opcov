name: "setup-nix"
description: "Install Nix with the xilo binary cache at xilos.dev as a substituter, and push every store path the job builds to it when given a token"

inputs:
  xilo-token:
    description: "Push token for the stubbedev/main cache; empty when the run has no secrets, such as a Dependabot pull request, which then only pulls"
    required: true

runs:
  using: "composite"
  steps:
    - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
    - uses: stubbedev/xilo@e23c96316500d2e4b668f20313ef3c76e103b5d9 # v2.0.2
      with:
        url: https://xilos.dev
        cache: stubbedev/main
        token: ${{ inputs.xilo-token }}
        version: v2.0.2
