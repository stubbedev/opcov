name: "setup-nix"
description: "Install Nix and restore the Nix store that every job on this runner platform shares from the Actions cache; only save-nix writes that cache"

runs:
  using: "composite"
  steps:
    - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
    - name: Name this platform's Nix store cache
      shell: bash
      env:
        PREFIX: nix-${{ runner.os }}-${{ runner.arch }}-
        INPUTS: ${{ hashFiles('flake.lock', 'Cargo.lock', 'nix/**') }}
      run: |
        {
          echo "NIX_STORE_CACHE_PREFIX=$PREFIX"
          echo "NIX_STORE_CACHE_KEY=$PREFIX$INPUTS"
        } >> "$GITHUB_ENV"
    - uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7
      id: restore
      with:
        primary-key: ${{ env.NIX_STORE_CACHE_KEY }}
        restore-prefixes-first-match: ${{ env.NIX_STORE_CACHE_PREFIX }}
    - name: Remember whether the cache already holds this store
      shell: bash
      env:
        HIT: ${{ steps.restore.outputs.hit-primary-key }}
      run: echo "NIX_STORE_CACHE_HIT=$HIT" >> "$GITHUB_ENV"
