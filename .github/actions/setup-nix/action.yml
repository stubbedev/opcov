name: "setup-nix"
description: "Install Nix, restore this job's Nix store from the Actions cache, and on a push replace the job's older cache with the new one"

runs:
  using: "composite"
  steps:
    - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
    - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
      with:
        primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('flake.lock', 'Cargo.lock', 'nix/**') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
        gc-max-store-size-linux: 5G
        gc-max-store-size-macos: 5G
        purge: ${{ github.event_name == 'push' }}
        purge-prefixes: nix-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
        purge-created: 0
        purge-primary-key: never
