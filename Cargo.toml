[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "Opcode-level line, branch-outcome and loop coverage for PHP"
license = "MIT"
repository = "https://github.com/stubbedev/opcov"
publish = false

[workspace.dependencies]
opcov-core = { path = "crates/opcov-core" }
opcov-sys = { path = "crates/opcov-sys" }
opcov-syntax = { path = "crates/opcov-syntax" }
bindgen = { version = "0.73.2", default-features = false, features = [
  "prettyplease",
  "runtime",
] }
cc = "1.11.3"
clap = { version = "4.6.9", features = ["derive"] }
proptest = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
missing_debug_implementations = "deny"
trivial_numeric_casts = "deny"
unnameable_types = "deny"
unreachable_pub = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
assertions_on_result_states = "deny"
clone_on_ref_ptr = "deny"
create_dir = "deny"
dbg_macro = "deny"
exit = "deny"
expect_used = "deny"
float_cmp_const = "deny"
get_unwrap = "deny"
implicit_return = "deny"
indexing_slicing = "deny"
infinite_loop = "deny"
iter_over_hash_type = "deny"
let_underscore_must_use = "deny"
lossy_float_literal = "deny"
map_err_ignore = "deny"
mem_forget = "deny"
missing_assert_message = "deny"
mod_module_files = "deny"
mutex_integer = "deny"
panic = "deny"
panic_in_result_fn = "deny"
print_stderr = "deny"
print_stdout = "deny"
rc_mutex = "deny"
redundant_type_annotations = "deny"
rest_pat_in_fully_bound_structs = "deny"
str_to_string = "deny"
string_add = "deny"
string_slice = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unused_result_ok = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
verbose_file_reads = "deny"
multiple_crate_versions = "allow"
needless_return = "allow"
