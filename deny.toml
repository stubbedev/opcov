[graph]
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
]

[advisories]
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained, not vulnerable: a compile-time macro crate that mago-syntax 1.61 depends on, with no maintained replacement upstream" },
]

[licenses]
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "CC-BY-4.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
  { crate = "syn@2", reason = "mago-syntax 1.61 reaches syn 2 through strum_macros and tracing-attributes while bindgen and clap use syn 3" },
]
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
